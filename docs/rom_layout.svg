<line x1="490" y1="105.1" x2="498" y2="105.2" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="109.2">Клавиатура <tspan class="a">20F1–2202</tspan></text>
<text class="d" x="500" y="120.2">Матрица 4x8: столбец — биты 4-5 порта FA, строки — …</text>
<rect x="420" y="117.8" width="70" height="19.3" fill="#f6c99b" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="127.8">2203</text>
<line x1="490" y1="127.4" x2="498" y2="129.2" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="133.2">Заморозка и самотесты <tspan class="a">2203–22D2</tspan></text>
<text class="d" x="500" y="144.2">Фиксация кадра (порт F8), контрольная сумма ПЗУ (не…</text>
<rect x="420" y="137.1" width="70" height="9.9" fill="#f3e19a" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="146.0">22D3</text>
<line x1="490" y1="142.0" x2="498" y2="153.2" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="157.2">Диспетчер клавиш <tspan class="a">22D3–233D</tspan></text>
<text class="d" x="500" y="168.2">dispatch_key + таблицы для режимов «живой»/«фиксаци…</text>
<rect x="420" y="147.0" width="70" height="267.7" fill="#f3e19a" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="157.0">233E</text>
<line x1="490" y1="162.0" x2="498" y2="177.2" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="181.2">Обработчики клавиш <tspan class="a">233E–2E83</tspan></text>
<text class="d" x="500" y="192.2">Режимы «живой»/«фиксация», пиктограммы, положение У…</text>
<rect x="420" y="414.7" width="70" height="3.8" fill="#f3e19a" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="417.5">2E84</text>
<line x1="490" y1="416.6" x2="498" y2="416.6" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="420.6">Пол пациента <tspan class="a">2E84–2EAC</tspan></text>
<text class="d" x="500" y="431.6">key_32</text>
<rect x="420" y="418.5" width="70" height="37.9" fill="#dedede" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="428.5">2EAD</text>
<line x1="490" y1="433.5" x2="498" y2="440.6" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="444.6">Строки ROM1 <tspan class="a">2EAD–3044</tspan></text>
<text class="d" x="500" y="455.6">Меню и подписи КОИ-7, шаблоны чисел «**.*»</text>
<rect x="420" y="456.4" width="70" height="280.4" fill="#b9e3b0" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="466.4">3045</text>
<line x1="490" y1="471.4" x2="498" y2="471.4" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="475.4">Измерения и формат <tspan class="a">3045–3C12</tspan></text>
<text class="d" x="500" y="486.4">Расстояние, периметр, площадь, вывод чисел; вызывае…</text>
<rect x="420" y="736.8" width="70" height="93.2" fill="#b5dde6" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="746.8">3C13</text>
<line x1="490" y1="751.8" x2="498" y2="751.8" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="755.8">Графика (часть 1) <tspan class="a">3C13–3FFF</tspan></text>
<text class="d" x="500" y="766.8">vid_call: 52 команды, таблица 0x3C38</text>
<text class="a" x="420" y="844.0">u_2000_2764-1.bin</text>
