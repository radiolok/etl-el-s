<line x1="890" y1="618.0" x2="898" y2="618.0" stroke="#999" stroke-width=".6"/>
<text class="n" x="900" y="622.0">Коэффициенты биометрии <tspan class="a">56AB–577A</tspan></text>
<text class="d" x="900" y="633.0">13 методов x 4 float (Hansmann, Hadlock, ...)</text>
<rect x="820" y="627.7" width="70" height="144.5" fill="#dedede" stroke="#555" stroke-width=".6"/>
<text class="a" x="823" y="637.7">577B</text>
<line x1="890" y1="642.7" x2="898" y2="642.7" stroke="#999" stroke-width=".6"/>
