<text class="n" x="900" y="154.6">Пиктограммы <tspan class="a">42C3–46DA</tspan></text>
<text class="d" x="900" y="165.6">8 картинок по 128 байт (положение тела/датчика)</text>
<rect x="820" y="232.8" width="70" height="169.6" fill="#b5dde6" stroke="#555" stroke-width=".6"/>
