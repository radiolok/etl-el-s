<style>.h{font:bold 16px sans-serif;fill:#111}.c{font:bold 12px sans-serif;fill:#111}.s{font:11px sans-serif;fill:#333}.a{font:10px monospace;fill:#555}.n{font:11px sans-serif;fill:#111}.d{font:10px sans-serif;fill:#444}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text class="h" x="20" y="26">ЭТС-ЭЛ-С (MEDELKOM SLE-101): составные части прошивки по ПЗУ</text>
<text class="s" x="20" y="46">Высота столбца пропорциональна размеру ПЗУ (2716 = 2 КБ, 2764 = 8 КБ). Адреса — в адресном пространстве 8085.</text>
<text class="c" x="20" y="62">КР573РФ2 (2716) «Д17»</text>
<rect x="20" y="70.0" width="70" height="1.9" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="70.9">0800</text>
<line x1="90" y1="71.0" x2="98" y2="71.0" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="75.0">Векторы RST <tspan class="a">0800–0814</tspan></text>
<text class="d" x="100" y="86.0">JMP 0815 + точки входа консоли (видны при сбросе на…</text>
<rect x="20" y="71.9" width="70" height="8.8" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="79.8">0815</text>
<line x1="90" y1="76.4" x2="98" y2="95.0" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="99.0">Сброс монитора <tspan class="a">0815–0873</tspan></text>
<text class="d" x="100" y="110.0">Инициализация 8251 FF/EF, поиск конца ОЗУ, трамплин…</text>
<rect x="20" y="80.8" width="70" height="55.0" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="90.8">0874</text>
<line x1="90" y1="95.8" x2="98" y2="119.0" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="123.0">Команды монитора <tspan class="a">0874–0AC4</tspan></text>
<text class="d" x="100" y="134.0">C D E F G H M P R S U W X; Intel HEX через EE/EF</text>
<rect x="20" y="135.8" width="70" height="35.0" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="145.8">0AC5</text>
<line x1="90" y1="150.8" x2="98" y2="150.8" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="154.8">Ввод/вывод монитора <tspan class="a">0AC5–0C3D</tspan></text>
<text class="d" x="100" y="165.8">Консоль 8251 FE/FF, канал EE/EF, hex-ввод/вывод</text>
<rect x="20" y="170.8" width="70" height="84.0" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="180.8">0C3E</text>
<line x1="90" y1="185.8" x2="98" y2="185.8" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="189.8">Точка останова <tspan class="a">0C3E–0FC6</tspan></text>
<text class="d" x="100" y="200.8">Вход по RST/JMP 0000, сохранение регистров</text>
<rect x="20" y="254.7" width="70" height="5.3" fill="#c9d7f0" stroke="#555" stroke-width=".6"/>
<text class="a" x="23" y="259.0">0FC7</text>
<line x1="90" y1="257.4" x2="98" y2="257.4" stroke="#999" stroke-width=".6"/>
<text class="n" x="100" y="261.4">Трамплин <tspan class="a">0FC7–0FFF</tspan></text>
<text class="d" x="100" y="272.4">Копируется в 07C7-07FF: возврат из точки останова, …</text>
<text class="a" x="20" y="289.4">u_0800_2716-monitor.bin</text>
<rect x="20" y="70" width="70" height="190.0" fill="none" stroke="#111" stroke-width="1.2"/>
<text class="c" x="420" y="62">К573РФ4А (2764) №1</text>
<rect x="420" y="70.0" width="70" height="22.4" fill="#f6c99b" stroke="#555" stroke-width=".6"/>
<text class="a" x="423" y="80.0">2000</text>
<line x1="490" y1="81.2" x2="498" y2="81.2" stroke="#999" stroke-width=".6"/>
<text class="n" x="500" y="85.2">Старт и главный цикл <tspan class="a">2000–20F0</tspan></text>
<text class="d" x="500" y="96.2">Стек, обнуление переменных, 8251, порты F8/FA, тест…</text>
<rect x="420" y="92.4" width="70" height="25.4" fill="#f3e19a" stroke="#555" stroke-width=".6"/>
